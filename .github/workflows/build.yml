name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: babi-macos
            python: "3.12"
            build_script: ./scripts/build_macos.sh
            package_step: macos
          - os: windows-latest
            artifact_name: babi-windows
            python: "3.12"
            build_script: bash ./scripts/build_windows.sh
            package_step: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify TFLite model artifact exists
        shell: bash
        run: |
          if [[ ! -f "program/static/model.tflite" ]]; then
            echo "Missing program/static/model.tflite"
            echo "Commit the TFLite model artifact, or add a CI conversion step with a committed model.keras."
            exit 1
          fi

      - name: Build app
        run: ${{ matrix.build_script }}

      - name: Package macOS app
        if: matrix.package_step == 'macos'
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/babi-macos.tar.gz" -C dist "BABI Data Analysis.app"

      - name: Package Windows app
        if: matrix.package_step == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "dist/BABI Data Analysis/*" -DestinationPath "release/babi-windows.zip" -Force

      - name: Build Windows onefile app
        if: matrix.package_step == 'windows'
        shell: bash
        run: bash ./scripts/build_windows_onefile.sh

      - name: Package Windows onefile app
        if: matrix.package_step == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "dist/BABI Data Analysis Onefile.exe" -DestinationPath "release/babi-windows-onefile.zip" -Force

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error
