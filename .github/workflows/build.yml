name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: babi-macos
            python: "3.12"
            build_script: ./scripts/build_macos.sh
          - os: windows-latest
            artifact_name: babi-windows
            python: "3.12"
            build_script: bash ./scripts/build_windows.sh

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[training]

      - name: Convert Keras model to TFLite
        run: python scripts/convert_model_to_tflite.py

      - name: Build app
        run: ${{ matrix.build_script }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/BABI Data Analysis*
          if-no-files-found: error
