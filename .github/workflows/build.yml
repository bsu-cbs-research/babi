name: Build Desktop Artifacts

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish build outputs to a GitHub Release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag to publish to (required when publish_release=true, e.g. v0.1.2)"
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: babi-macos
            python: "3.12"
            build_script: ./scripts/build_macos.sh
            package_step: macos
          - os: windows-latest
            artifact_name: babi-windows
            python: "3.12"
            build_script: bash ./scripts/build_windows.sh
            package_step: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify TFLite model artifact exists
        shell: bash
        run: |
          if [[ ! -f "program/static/model.tflite" ]]; then
            echo "Missing program/static/model.tflite"
            echo "Commit the TFLite model artifact, or add a CI conversion step with a committed model.keras."
            exit 1
          fi

      - name: Build app
        run: ${{ matrix.build_script }}

      - name: Package macOS app
        if: matrix.package_step == 'macos'
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/babi-macos.tar.gz" -C dist "BABI Data Analysis.app"

      - name: Package Windows app
        if: matrix.package_step == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "dist/BABI Data Analysis/*" -DestinationPath "release/babi-windows.zip" -Force

      - name: Build Windows onefile app
        if: matrix.package_step == 'windows'
        shell: bash
        run: bash ./scripts/build_windows_onefile.sh

      - name: Package Windows onefile app
        if: matrix.package_step == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "dist/BABI Data Analysis Onefile.exe" -DestinationPath "release/babi-windows-onefile.zip" -Force

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error

  publish_release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: babi-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
