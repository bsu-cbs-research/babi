    "matplotlib-inline>=0.1.7",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pillow>=11.3.0",
    "pywavelets>=1.9.0",
    "ruptures>=1.1.10",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "setuptools>=80.9.0",
    "tensorflow>=2.20.0",
    "tk>=0.1.0",
